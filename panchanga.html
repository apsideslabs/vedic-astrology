<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panchanga — Jyotish</title>
<meta name="description" content="The five limbs of the Vedic day for any date and place: tithi, vara, nakshatra, yoga, karana, with sunrise and moonrise.">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="panchanga" data-root="">

<main class="shell">

  <p class="eyebrow">Workspace · 03</p>
  <h1>Panchanga</h1>
  <p class="lede">The five limbs of the day — tithi, vara, nakshatra, yoga, karana —
    reckoned from sunrise, with the day's rise and set times.</p>

  <form id="f" class="panel calc" autocomplete="off" style="margin:22px 0 0">
    <div class="field"><label for="date">Date, local</label><input id="date" type="date" required></div>
    <div class="field"><label for="preset">Place</label>
      <select id="preset"><option value="">— choose —</option></select></div>
    <div class="field"><label for="lat">Latitude</label><input id="lat" type="number" step="0.0001" value="13.0827" required></div>
    <div class="field"><label for="lon">Longitude</label><input id="lon" type="number" step="0.0001" value="80.2707" required></div>
    <div class="field"><label for="tz">UT offset, h</label><input id="tz" type="number" step="0.0001" value="5.5" required></div>
    <div class="submit-cell"><button class="btn" type="submit">Compute</button></div>
  </form>

  <div id="err" class="notice hidden" style="margin-top:18px"></div>
  <div id="empty" class="small muted hidden"></div>
  <div id="out" class="hidden"></div>

</main>

<footer class="site"><div class="shell">
  <div class="cols">
    <div>Jyotish · engine v1.0.0 · MIT<br>
      <span class="mono">sunrise and moonrise from astronomy-engine · Lahiri ayanamsa</span></div>
    <div class="mono">For study and self-reflection.</div>
  </div>
</div></footer>

<script src="assets/js/astronomy.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/ephemeris.js"></script>
<script src="assets/js/panchanga.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/panchanga-page.js"></script>
</body>
</html>
